<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Rellene el formulario</h1>
    
  <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <br><br>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required>

        <br><br>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion">

        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required>

        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono">

        <br><br>

        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha">

        <br><br>

        <p>Sexo:</p>

        <input type="radio" id="hombre" name="sexo" value="hombre">
        <label for="hombre">Hombre</label>

        <input type="radio" id="mujer" name="sexo" value="mujer">
        <label for="mujer">Mujer</label>

        <br><br>

 

        <p>Estado de las bicicletas:</p>

        <input type="radio" id="nuevas" name="estado_bicicleta" value="nuevas">
        <label for="nuevas">Deben ser nuevas</label>

        <br>

        <input type="radio" id="usadas" name="estado_bicicleta" value="usadas">
        <label for="usadas">Pueden ser usadas</label>

        <br><br>

        <label for="observaciones">Observaciones:</label>

        <br>

        <textarea id="observaciones"
                  name="observaciones"
                  rows="6"
                  cols="50"
                  placeholder="Escriba aquí sus observaciones..."></textarea>

        <br><br>


        <input type="submit" value="Enviar">

    </form>

            <li><a href="formulario.html">Formularios</a></li>
        
        </ul>
    </nav>
</body>
</html>
